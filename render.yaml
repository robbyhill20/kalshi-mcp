services:
  - type: web
    name: kalshi-grok-mcp
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /health
    autoDeployTrigger: "off"
    disk:
      name: kalshi-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_PATH
        value: /var/data/kalshi.sqlite3
      - key: KALSHI_ENV
        value: production
      # A Blueprint value here overwrites the dashboard on every sync and turns live trading off.
      - key: DRY_RUN
        sync: false
      - key: TRADING_ENABLED
        sync: false
      - key: REQUIRE_TRADE_APPROVAL
        value: "false"
      - key: MAX_DAILY_ORDER_COST_CENTS
        value: "20000"
      - key: KALSHI_API_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: MCP_READ_TOKEN
        generateValue: true
      - key: MCP_DIRECTOR_TOKEN
        generateValue: true
      - key: MCP_AXE_TOKEN
        generateValue: true
      - key: AXE_MAX_ORDER_COST_CENTS
        value: "10000"
      - key: AXE_MAX_DAILY_ORDER_COST_CENTS
        value: "20000"
      - key: AXE_INDEX_SERIES
        value: "KXINX,KXINXU,KXINXPOS,KXNASDAQ100,KXNASDAQ100U,KXDJI"
      - key: PERPS_ENABLED
        value: "false"
      - key: KALSHI_MARGIN_API_KEY_ID
        sync: false
      - key: KALSHI_MARGIN_PRIVATE_KEY
        sync: false
      - key: AXE_PERP_SYMBOLS
        value: "TSLA,NVDA,AAPL"
      - key: AXE_PERP_MAX_ORDER_NOTIONAL_CENTS
        value: "10000"
      - key: AXE_PERP_MAX_DAILY_NOTIONAL_CENTS
        value: "20000"
      - key: AXE_PERP_MAX_LEVERAGE
        value: "1"
